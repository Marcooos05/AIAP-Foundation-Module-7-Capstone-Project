file_path: "./data/synthetic_data_166.csv"
target_column: "diabetes_diagnosis"
positive_class: "Positive"       # diabetes = Positive is the positive class (compared as strings)
min_age: 18                      # rows below this age are dropped: adult screening population (EDA §15)
test_size: 0.2                   # stratified 80/20 train/test; no separate validation set (EDA §16)
random_state: 42
cv: 5                            # stratified k-fold on the training set, used by modelling (EDA §16)
scoring: average_precision       # PR-AUC: GridSearchCV and model-selection metric (lit. review #6)
target_recall: 0.90              # decision threshold = highest one keeping out-of-fold recall >= this (README §5.1)
n_jobs: -1                       # parallel workers (-1 = all cores)
# Every model uses class_weight='balanced'; no resampling (README §5.2).
# Baseline: logistic_regression (src/models.py). Advanced: random_forest, gradient_boosting
# (src/advanced_models.py); gradient_boosting is HistGradientBoostingClassifier, which supports class_weight.
param_grids:
  logistic_regression:
    classifier__C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    classifier__n_estimators: [300]
    classifier__max_depth: [4, 8, null]
    classifier__min_samples_leaf: [1, 5]
  gradient_boosting:
    classifier__learning_rate: [0.05, 0.1]
    classifier__max_depth: [2, 3]
    classifier__max_iter: [100, 300]
# Wider, regularisation-focused random searches (src/model_optimization.py). Stage 2's best
# models sat on the edges of param_grids, and the ensembles overfitted (README, Model optimization).
search_spaces:
  logistic_regression:
    classifier__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    classifier__l1_ratio: [0.0, 1.0]       # 0 = L2, 1 = L1
    poly__degree: [1, 2]                   # 2 adds squares and interactions: tests for underfitting
  random_forest:
    classifier__n_estimators: [300]
    classifier__max_depth: [2, 3, 4, 6, 8, null]
    classifier__min_samples_leaf: [5, 10, 20, 40]
    classifier__max_features: [sqrt, 0.5, 1.0]
  gradient_boosting:
    classifier__learning_rate: [0.01, 0.03, 0.05, 0.1]
    classifier__max_iter: [50, 100, 200, 400]
    classifier__max_depth: [1, 2, 3]
    classifier__min_samples_leaf: [10, 20, 40]
    classifier__l2_regularization: [0.0, 1.0, 10.0]
optimization:
  cv_repeats: 3                  # RepeatedStratifiedKFold: 5 folds x 3 shuffles
  n_iter: 30                     # random search candidates per model and glucose variant
  nested_n_iter: 10              # candidates per outer fold of nested CV
  max_fit_gap: 0.10              # train-validation PR-AUC gap above this is labelled overfit
  learning_curve_points: 5       # training sizes, from 20% to 100%
numeric_features:
  - age
  - bmi
  - blood_pressure
  - fasting_glucose_level
  - cholesterol_level
  - physical_activity_frequency
binary_features:
  - family_history_of_diabetes
# Expected levels of every text column; any other value raises during cleaning (EDA §3.3).
categorical_levels:
  family_history_of_diabetes: [Absent, Present]
  diabetes_diagnosis: [Negative, Positive]
# Dropped in the "without_glucose" feature variant: glucose is part of how diabetes is
# diagnosed, so every model is also trained without it (README §5.7, EDA §13).
leakage_candidate_features: [fasting_glucose_level]
# Engineered features for the Logistic Regression variants (EDA §17), chosen from
# reports/feature_comparison.json. sqrt_physical_activity replaces the raw activity feature;
# the others are added. No candidate met the retention rule below, so LR uses the raw features.
# To use some anyway, e.g.:  lr_engineered_features: [sqrt_physical_activity, family_history_x_bmi]
lr_engineered_features: []
# Feature selection & validation, on the training set only (src/feature_engineering.py):
#   every candidate is cross-validated one at a time against the raw-feature baseline and
#   ranked by L1 and permutation importance; main.py reports which ones meet the rule below.
candidate_features:
  - sqrt_physical_activity
  - family_history_x_bmi
  - bmi_squared
  - bmi_band
  - age_band
  - elevated_bp
  - prediabetic_glucose
selection_scoring: average_precision   # PR-AUC: suits the 15% positive class (README §5.3)
min_cv_gain: 0.005                     # keep a candidate only if mean CV PR-AUC gain >= this, in most folds
# Clinically plausible ranges, used only to count suspicious values in the
# validation report; nothing is dropped because of them (EDA §3.4).
plausible_ranges:
  age: [18, 100]
  bmi: [12, 70]
  blood_pressure: [70, 220]
  fasting_glucose_level: [50, 400]
  cholesterol_level: [80, 400]
  physical_activity_frequency: [0, 1]
